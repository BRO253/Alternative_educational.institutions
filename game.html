<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Арканоид — Разбей все блоки!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            overflow: hidden;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #ff6fd8, #3813c2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: none;
        }

        .hud {
            display: flex;
            gap: 40px;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .hud span {
            color: #aaa;
        }

        .hud strong {
            color: #ff6fd8;
        }

        canvas {
            border: 2px solid #3813c2;
            border-radius: 8px;
            background: #0d0d3b;
            display: block;
            box-shadow: 0 0 40px rgba(56, 19, 194, 0.4);
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 10, 46, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .overlay.hidden { display: none; }

        .overlay h2 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .overlay p {
            font-size: 1.2rem;
            color: #ccc;
            margin-bottom: 30px;
        }

        .btn {
            padding: 14px 40px;
            font-size: 1.2rem;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #ff6fd8, #3813c2);
            color: #fff;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 111, 216, 0.5);
        }

        .lives {
            display: flex;
            gap: 6px;
        }

        .lives .heart {
            width: 20px;
            height: 20px;
            background: #ff4d6d;
            clip-path: path('M10 18s-1-.5-3.5-3C3.5 12 1 9.5 1 7a4 4 0 0 1 4-4c1.5 0 3 1 5 3 2-2 3.5-3 5-3a4 4 0 0 1 4 4c0 2.5-2.5 5-5.5 8C11 17.5 10 18 10 18z');
        }

        .instructions {
            margin-top: 12px;
            font-size: 0.85rem;
            color: #666;
        }
    </style>
</head>
<body>

<h1>Арканоид</h1>

<div class="hud">
    <div><span>Счёт: </span><strong id="score">0</strong></div>
    <div><span>Уровень: </span><strong id="level">1</strong></div>
    <div class="lives" id="lives"></div>
</div>

<div style="position: relative; display: inline-block;">
    <canvas id="game" width="780" height="520"></canvas>

    <div class="overlay" id="startScreen">
        <h2>Арканоид</h2>
        <p>Разбей все блоки, управляя платформой!</p>
        <button class="btn" id="startBtn">Начать игру</button>
        <p class="instructions">Стрелки или мышь — двигать платформу, Пробел — пауза</p>
    </div>

    <div class="overlay hidden" id="gameOverScreen">
        <h2 id="endTitle">Игра окончена</h2>
        <p id="endMsg">Ваш счёт: 0</p>
        <button class="btn" id="restartBtn">Играть снова</button>
    </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

// --- Game state ---
let score, lives, level, balls, paddle, bricks, particles, powerups;
let running = false, paused = false, animId;

// --- Config ---
const PADDLE_W = 120, PADDLE_H = 14, PADDLE_SPEED = 8;
const BALL_R = 7, BALL_SPEED_BASE = 5;
const BRICK_ROWS = 6, BRICK_COLS = 13, BRICK_H = 22, BRICK_PAD = 4, BRICK_TOP = 50;
const BRICK_W = (W - (BRICK_COLS + 1) * BRICK_PAD) / BRICK_COLS;

const COLORS = [
    ['#ff6fd8', '#ff9a9e'],
    ['#a18cd1', '#fbc2eb'],
    ['#fad0c4', '#ffd1ff'],
    ['#84fab0', '#8fd3f4'],
    ['#fa709a', '#fee140'],
    ['#a1c4fd', '#c2e9fb'],
];

// --- Keys ---
const keys = {};
document.addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'Space') { e.preventDefault(); paused = !paused; } });
document.addEventListener('keyup', e => keys[e.code] = false);

let mouseX = W / 2;
canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    mouseX = (e.clientX - rect.left) * (W / rect.width);
});

// --- Particles ---
function spawnParticles(x, y, color, count = 8) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 3;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 30 + Math.random() * 20,
            maxLife: 50,
            color,
            size: 2 + Math.random() * 3
        });
    }
}

// --- Powerups ---
function maybeSpawnPowerup(x, y) {
    if (Math.random() > 0.15) return;
    const types = ['expand', 'shrink', 'multiball', 'fast', 'slow'];
    const type = types[Math.floor(Math.random() * types.length)];
    const colors = { expand: '#84fab0', shrink: '#fa709a', multiball: '#a18cd1', fast: '#fee140', slow: '#8fd3f4' };
    powerups.push({ x, y, vy: 2, type, color: colors[type], w: 26, h: 14 });
}

function applyPowerup(type) {
    switch (type) {
        case 'expand': paddle.w = Math.min(200, paddle.w + 30); setTimeout(() => paddle.w = PADDLE_W, 8000); break;
        case 'shrink': paddle.w = Math.max(60, paddle.w - 30); setTimeout(() => paddle.w = PADDLE_W, 6000); break;
        case 'multiball':
            const b = balls[0] || { x: paddle.x + paddle.w / 2, y: paddle.y - BALL_R, speed: BALL_SPEED_BASE };
            for (let i = 0; i < 2; i++) {
                const angle = -Math.PI / 4 + Math.random() * Math.PI / 2 - Math.PI / 2;
                balls.push({ x: b.x, y: b.y, vx: Math.cos(angle) * b.speed, vy: Math.sin(angle) * b.speed, speed: b.speed, r: BALL_R });
            }
            break;
        case 'fast': balls.forEach(b => { b.speed = Math.min(10, b.speed + 1.5); normalizeBall(b); }); break;
        case 'slow': balls.forEach(b => { b.speed = Math.max(3, b.speed - 1.5); normalizeBall(b); }); break;
    }
}

function normalizeBall(b) {
    const mag = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
    b.vx = (b.vx / mag) * b.speed;
    b.vy = (b.vy / mag) * b.speed;
}

// --- Init ---
function initGame() {
    score = 0; lives = 3; level = 1;
    updateHUD();
    initLevel();
}

function initLevel() {
    particles = []; powerups = [];
    paddle = { x: W / 2 - PADDLE_W / 2, y: H - 36, w: PADDLE_W, h: PADDLE_H };
    balls = [];
    spawnBall();
    buildBricks();
    updateHUD();
}

function spawnBall() {
    const angle = -Math.PI / 4 - Math.random() * Math.PI / 2;
    const speed = BALL_SPEED_BASE + (level - 1) * 0.5;
    balls.push({
        x: paddle.x + paddle.w / 2,
        y: paddle.y - BALL_R - 1,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        speed, r: BALL_R
    });
}

function buildBricks() {
    bricks = [];
    const rows = Math.min(BRICK_ROWS + Math.floor((level - 1) / 2), 10);
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < BRICK_COLS; c++) {
            const hp = level >= 3 && Math.random() < 0.2 ? 2 : 1;
            bricks.push({
                x: BRICK_PAD + c * (BRICK_W + BRICK_PAD),
                y: BRICK_TOP + r * (BRICK_H + BRICK_PAD),
                w: BRICK_W, h: BRICK_H,
                color: COLORS[r % COLORS.length],
                alive: true,
                hp
            });
        }
    }
}

function updateHUD() {
    document.getElementById('score').textContent = score;
    document.getElementById('level').textContent = level;
    const livesEl = document.getElementById('lives');
    livesEl.innerHTML = '';
    for (let i = 0; i < lives; i++) {
        const heart = document.createElement('div');
        heart.className = 'heart';
        livesEl.appendChild(heart);
    }
}

// --- Update ---
function update() {
    if (paused) return;

    // Paddle
    if (keys['ArrowLeft'] || keys['KeyA']) paddle.x -= PADDLE_SPEED;
    if (keys['ArrowRight'] || keys['KeyD']) paddle.x += PADDLE_SPEED;

    // Mouse
    const target = mouseX - paddle.w / 2;
    paddle.x += (target - paddle.x) * 0.15;
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

    // Balls
    for (let i = balls.length - 1; i >= 0; i--) {
        const b = balls[i];
        b.x += b.vx;
        b.y += b.vy;

        // Walls
        if (b.x - b.r < 0) { b.x = b.r; b.vx = Math.abs(b.vx); }
        if (b.x + b.r > W) { b.x = W - b.r; b.vx = -Math.abs(b.vx); }
        if (b.y - b.r < 0) { b.y = b.r; b.vy = Math.abs(b.vy); }

        // Bottom
        if (b.y + b.r > H) {
            balls.splice(i, 1);
            if (balls.length === 0) {
                lives--;
                updateHUD();
                if (lives <= 0) { endGame(false); return; }
                spawnBall();
            }
            continue;
        }

        // Paddle
        if (b.vy > 0 &&
            b.y + b.r >= paddle.y && b.y + b.r <= paddle.y + paddle.h + 4 &&
            b.x >= paddle.x && b.x <= paddle.x + paddle.w) {
            const hit = (b.x - paddle.x) / paddle.w; // 0..1
            const angle = -Math.PI / 6 - hit * (Math.PI * 2 / 3);
            b.vx = Math.cos(angle) * b.speed;
            b.vy = Math.sin(angle) * b.speed;
            b.y = paddle.y - b.r;
            spawnParticles(b.x, b.y, '#fff', 4);
        }

        // Bricks
        for (const brick of bricks) {
            if (!brick.alive) continue;
            if (b.x + b.r > brick.x && b.x - b.r < brick.x + brick.w &&
                b.y + b.r > brick.y && b.y - b.r < brick.y + brick.h) {

                // Determine side
                const overlapL = b.x + b.r - brick.x;
                const overlapR = brick.x + brick.w - (b.x - b.r);
                const overlapT = b.y + b.r - brick.y;
                const overlapB = brick.y + brick.h - (b.y - b.r);
                const minO = Math.min(overlapL, overlapR, overlapT, overlapB);
                if (minO === overlapT || minO === overlapB) b.vy = -b.vy;
                else b.vx = -b.vx;

                brick.hp--;
                if (brick.hp <= 0) {
                    brick.alive = false;
                    score += 10 * level;
                    spawnParticles(brick.x + brick.w / 2, brick.y + brick.h / 2, brick.color[0], 12);
                    maybeSpawnPowerup(brick.x + brick.w / 2, brick.y + brick.h / 2);
                } else {
                    spawnParticles(brick.x + brick.w / 2, brick.y + brick.h / 2, brick.color[0], 5);
                }
                updateHUD();
                break;
            }
        }
    }

    // Powerups
    for (let i = powerups.length - 1; i >= 0; i--) {
        const p = powerups[i];
        p.y += p.vy;
        if (p.y > H) { powerups.splice(i, 1); continue; }
        if (p.y + p.h >= paddle.y && p.x + p.w / 2 >= paddle.x && p.x - p.w / 2 <= paddle.x + paddle.w) {
            applyPowerup(p.type);
            spawnParticles(p.x, p.y, p.color, 10);
            powerups.splice(i, 1);
        }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Level complete?
    if (bricks.every(b => !b.alive)) {
        level++;
        if (level > 10) { endGame(true); return; }
        initLevel();
    }
}

// --- Draw ---
function draw() {
    ctx.clearRect(0, 0, W, H);

    // Bricks
    for (const brick of bricks) {
        if (!brick.alive) continue;
        const grad = ctx.createLinearGradient(brick.x, brick.y, brick.x + brick.w, brick.y + brick.h);
        grad.addColorStop(0, brick.color[0]);
        grad.addColorStop(1, brick.color[1]);
        ctx.fillStyle = grad;
        ctx.beginPath();
        roundRect(ctx, brick.x, brick.y, brick.w, brick.h, 4);
        ctx.fill();
        if (brick.hp > 1) {
            ctx.strokeStyle = 'rgba(255,255,255,0.6)';
            ctx.lineWidth = 2;
            ctx.stroke();
        }
    }

    // Paddle
    const pGrad = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x + paddle.w, paddle.y);
    pGrad.addColorStop(0, '#ff6fd8');
    pGrad.addColorStop(1, '#3813c2');
    ctx.fillStyle = pGrad;
    ctx.beginPath();
    roundRect(ctx, paddle.x, paddle.y, paddle.w, paddle.h, 7);
    ctx.fill();
    // Glow
    ctx.shadowColor = '#ff6fd8';
    ctx.shadowBlur = 15;
    ctx.fill();
    ctx.shadowBlur = 0;

    // Balls
    for (const b of balls) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.shadowColor = '#fff';
        ctx.shadowBlur = 12;
        ctx.fill();
        ctx.shadowBlur = 0;
    }

    // Powerups
    for (const p of powerups) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = 0.9;
        ctx.beginPath();
        roundRect(ctx, p.x - p.w / 2, p.y, p.w, p.h, 6);
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#000';
        ctx.font = 'bold 10px sans-serif';
        ctx.textAlign = 'center';
        const labels = { expand: '+', shrink: '-', multiball: 'x3', fast: '>>', slow: '<<' };
        ctx.fillText(labels[p.type], p.x, p.y + 11);
    }

    // Particles
    for (const p of particles) {
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (p.life / p.maxLife), 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Paused
    if (paused) {
        ctx.fillStyle = 'rgba(10,10,46,0.7)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 40px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('ПАУЗА', W / 2, H / 2);
        ctx.font = '18px sans-serif';
        ctx.fillText('Нажмите Пробел для продолжения', W / 2, H / 2 + 40);
    }
}

function roundRect(ctx, x, y, w, h, r) {
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

// --- Game loop ---
function loop() {
    update();
    draw();
    if (running) animId = requestAnimationFrame(loop);
}

function startGame() {
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('gameOverScreen').classList.add('hidden');
    running = true;
    paused = false;
    initGame();
    loop();
}

function endGame(won) {
    running = false;
    cancelAnimationFrame(animId);
    const screen = document.getElementById('gameOverScreen');
    document.getElementById('endTitle').textContent = won ? 'Победа!' : 'Игра окончена';
    document.getElementById('endMsg').textContent = `Ваш счёт: ${score} | Уровень: ${level}`;
    screen.classList.remove('hidden');
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', startGame);
</script>

</body>
</html>
